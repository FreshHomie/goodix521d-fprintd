[Unit]
ConditionPathExists=/usr/lib64/goodix521d/libgoodix521d-native.so
ConditionPathExists=/var/lib/goodix521d/contact-reference.json

[Service]
ExecStart=
ExecStart=/usr/libexec/goodix521d/fprintd
Environment=LD_LIBRARY_PATH=/usr/lib64/goodix521d/daemon-lib
# Retain the distribution's ProtectHome, MDWE and other daemon protections.
LimitCORE=0
RuntimeDirectory=goodix521d-capture
RuntimeDirectoryMode=0700
UMask=0077
